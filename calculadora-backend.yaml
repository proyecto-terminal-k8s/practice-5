apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-backend
  namespace: practice-5
  labels:
    app.kubernetes.io/name: calculadora-backend
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calculadora-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculadora-backend
    spec:
      containers:
        - name: backend
          image: calculadora-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REQUEST_LOG_FILE
              value: /app/logs/api-requests.txt
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: request-logs
              mountPath: /app/logs
      volumes:
        - name: request-logs
          persistentVolumeClaim:
            claimName: calculadora-logs
